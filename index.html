<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p>Organize your daily thoughts, work, and studies effortlessly.</p>
  </header>

  <main>
    <!-- Section 1: Add a Note -->
    <section class="card-section">
      <h2>Add a Note</h2>
      <form id="note-form">
        <div class="form-group flex-grow">
          <label for="note-input">Note Text</label>
          <input type="text" id="note-input" placeholder="What's on your mind? (Max 200 chars)" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Note</button>
      </form>
      <p id="error-message" class="error-text"></p>
    </section>

    <!-- Section 2: Your Notes -->
    <section class="card-section">
      <div class="notes-header">
        <h2>Your Notes</h2>
        <button id="clear-all-btn" class="btn-danger">Clear All</button>
      </div>

      <div class="search-container">
        <label for="search-input" class="sr-only">Search notes</label>
        <input type="text" id="search-input" placeholder="Search notes by keyword...">
      </div>

      <p id="note-count">You have no notes yet.</p>
      
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built for productivity.</p>
  </footer>

</body>
</html>
